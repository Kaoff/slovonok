<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slovonok — forbidden words</title>
<style>
  /* Fonts are served by the app: the overlay must not depend on the internet. */
  @font-face { font-family: "Orbitron"; font-weight: 700; src: url("../fonts/orbitron-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Orbitron"; font-weight: 900; src: url("../fonts/orbitron-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: "Share Tech Mono"; font-weight: 400; src: url("../fonts/share-tech-mono-latin-400-normal.woff2") format("woff2"); }

  :root {
    --color: #00f0ff;
    --size: 1.75rem;
    --alert: #ff2bd6;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body {
    box-sizing: border-box;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: .5em;
    font-size: var(--size);
    font-family: "Orbitron", sans-serif;
    font-weight: 700;
    color: var(--color);
  }
  body[data-position="top"] { justify-content: flex-start; }
  body[data-position="middle"] { justify-content: center; }
  body[data-position="bottom"] { justify-content: flex-end; }
  body[data-align="left"] { align-items: flex-start; }
  body[data-align="center"] { align-items: center; }
  body[data-align="right"] { align-items: flex-end; }

  .word {
    --c: var(--color);
    display: flex;
    align-items: center;
    gap: .75em;
    padding: .25em .75em;
    background: #05060bcc;
    border: 1px solid var(--c);
    box-shadow: 0 0 .4em color-mix(in srgb, var(--c) 60%, transparent);
    text-shadow: 0 0 .4em var(--c);
    /* No clip-path for cut corners: with fractional sizes it cuts the right/bottom edges off */
    animation: enter .6s ease-out both;
  }
  .text {
    font-family: "Share Tech Mono", ui-monospace, monospace;
    font-weight: 400;
    letter-spacing: .08em;
    white-space: pre;
  }
  .count {
    min-width: 1.6em;
    padding: 0 .35em;
    text-align: center;
    font-weight: 900;
    font-size: .85em;
    color: #05060b;
    background: var(--c);
    text-shadow: none;
  }
  body[data-count="false"] .count { display: none; }

  /* A word was detected */
  .word.hit { animation: hit .9s ease-out; }
  /* A word was just added */
  .word.added { animation: added 1.2s ease-out both; }

  @keyframes enter {
    from { opacity: 0; transform: translateX(-1em); }
    to { opacity: 1; transform: none; }
  }
  @keyframes hit {
    0%   { transform: scale(1.18) translateX(-.15em); }
    10%  { transform: scale(1.18) translateX(.15em); }
    20%  { transform: scale(1.18) translateX(-.1em); }
    30%  { transform: scale(1.12) translateX(.1em); }
    100% { transform: none; }
  }
  @keyframes added {
    0%   { opacity: 0; transform: scale(.6); filter: brightness(3); }
    15%  { opacity: 1; transform: scale(1.15); }
    25%  { opacity: .2; }
    35%  { opacity: 1; }
    45%  { opacity: .4; }
    60%  { opacity: 1; transform: scale(1); filter: brightness(1.6); }
    100% { transform: none; filter: none; }
  }
  /* The magenta flash lasts as long as the hit animation (the class is removed when it ends) */
  .word.hit { --c: var(--alert); }
</style>
</head>
<body data-position="top" data-align="left" data-count="true">
<script type="module">
let words = new Map(); // id → { el, textEl, countEl }
let ready = false; // the first config only fills the list, without the "added" animation

// ---------------------------------------------------------------------------
// How a word is shown
// ---------------------------------------------------------------------------
/** "é _ _ _ x": first and last letters, the others hidden. Short tokens stay mostly hidden. */
function partial(text) {
  return text
    .trim()
    .split(/\s+/)
    .map((token) => {
      const letters = [...token];
      const shown = letters.map((l, i) =>
        letters.length >= 3 && (i === 0 || i === letters.length - 1) ? l : "_",
      );
      if (letters.length === 2) shown[0] = letters[0];
      return shown.join(" ");
    })
    .join("   ");
}

function label(word) {
  if (word.display_mode === "hidden") return "???";
  if (word.display_mode === "partial") return partial(word.word);
  return word.word;
}

// ---------------------------------------------------------------------------
// List
// ---------------------------------------------------------------------------
function animate(el, className) {
  el.classList.remove("hit", "added");
  void el.offsetWidth; // restarts the animation if it is already running
  el.classList.add(className);
  el.addEventListener("animationend", () => el.classList.remove(className), { once: true });
}

// The user's CSS goes in its own <style> added last in <head>: it wins over the built-in rules
// when specificity is equal (the .hit/.added states need a more specific selector or !important).
const customStyle = document.createElement("style");
document.head.append(customStyle);
function applyCustomCss(css) {
  if (customStyle.textContent !== css) customStyle.textContent = css;
}

function render(config) {
  const style = config.display?.words ?? {};
  document.documentElement.style.setProperty("--size", `${style.font_size ?? 1.75}rem`);
  document.documentElement.style.setProperty("--color", style.color ?? "#00f0ff");
  document.body.dataset.position = style.position ?? "top";
  document.body.dataset.align = style.align ?? "left";
  document.body.dataset.count = String(style.show_count ?? true);
  applyCustomCss(style.custom_css ?? "");

  const active = config.words.filter((w) => w.enabled && w.word.trim());
  const ids = new Set(active.map((w) => w.id));

  for (const [id, entry] of words) {
    if (!ids.has(id)) {
      entry.el.remove();
      words.delete(id);
    }
  }

  active.forEach((word, index) => {
    let entry = words.get(word.id);
    const isNew = !entry;
    if (isNew) {
      const el = document.createElement("div");
      el.className = "word";
      const textEl = document.createElement("span");
      textEl.className = "text";
      const countEl = document.createElement("span");
      countEl.className = "count";
      el.append(textEl, countEl);
      entry = { el, textEl, countEl };
      words.set(word.id, entry);
    }
    entry.textEl.textContent = label(word);
    entry.countEl.textContent = word.count;
    // Keeps the DOM in the panel's order without recreating (and so without restarting) the others
    if (document.body.children[index] !== entry.el) document.body.insertBefore(entry.el, document.body.children[index] ?? null);
    if (isNew && ready) animate(entry.el, "added");
  });
  ready = true;
}

function onDetection(word) {
  const entry = words.get(word.id);
  if (!entry) return;
  entry.countEl.textContent = word.count;
  animate(entry.el, "hit");
}

// ---------------------------------------------------------------------------
// Server connection (reconnects automatically if the app restarts)
// ---------------------------------------------------------------------------
function connect(delay = 500) {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { delay = 500; };
  ws.onmessage = (e) => {
    const event = JSON.parse(e.data);
    if (event.type === "config") render(event.config);
    if (event.type === "detection") onDetection(event.word);
  };
  ws.onclose = () => setTimeout(() => connect(Math.min(delay * 2, 5000)), delay);
}
connect();
</script>
</body>
</html>
