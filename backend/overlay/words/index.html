<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slovonok — forbidden words</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="animations.css">
<!-- default.css (the built-in look) is added by the script unless custom CSS is enabled,
     then the user's CSS, in a <style> placed last. Without custom CSS there is no other style. -->
</head>
<body>
<script type="module">
// Two uses of the same page:
// - in OBS (browser source): /overlay/words/, fed by the app's WebSocket
// - in the panel's preview: /overlay/words/?preview, fed by messages from the panel
//   (so unsaved changes show up instantly)
const PREVIEW = new URLSearchParams(location.search).has("preview");

const words = new Map(); // id → { el, textEl, countEl }
let animations = { enter: "slide", exit: "fade", hit: "shake" };

// ---------------------------------------------------------------------------
// Styles
// ---------------------------------------------------------------------------
const customStyle = document.createElement("style");
document.head.append(customStyle);
let defaultStyle = null; // <link> to default.css, only present when custom CSS is off

function setDefaultStyle(on) {
  if (on && !defaultStyle) {
    defaultStyle = document.createElement("link");
    defaultStyle.rel = "stylesheet";
    defaultStyle.href = "default.css";
    customStyle.before(defaultStyle); // before the user's CSS, which must win
  } else if (!on && defaultStyle) {
    defaultStyle.remove();
    defaultStyle = null;
  }
}

const JUSTIFY = { top: "flex-start", middle: "center", bottom: "flex-end" };
const ITEMS = { left: "flex-start", center: "center", right: "flex-end" };

/** The panel's settings are only CSS variables, read by default.css. */
function setVariables(vars) {
  const root = document.documentElement.style;
  for (const [name, value] of Object.entries(vars)) {
    if (value == null) root.removeProperty(name);
    else root.setProperty(name, value);
  }
}

function applyStyle(style) {
  const custom = style.custom_css_enabled === true;
  setDefaultStyle(!custom);
  setVariables({
    "--size": custom ? null : `${style.font_size ?? 1.75}rem`,
    "--color": custom ? null : style.color ?? "#00f0ff",
    "--justify": custom ? null : JUSTIFY[style.position] ?? "flex-start",
    "--items": custom ? null : ITEMS[style.align] ?? "flex-start",
    "--count": custom ? null : (style.show_count ?? true) ? "block" : "none",
  });
  const css = custom ? style.custom_css ?? "" : "";
  if (customStyle.textContent !== css) customStyle.textContent = css;
  animations = {
    enter: style.enter_animation ?? "slide",
    exit: style.exit_animation ?? "fade",
    hit: style.hit_animation ?? "shake",
  };
}

// ---------------------------------------------------------------------------
// How a word is shown
// ---------------------------------------------------------------------------
/** "é _ _ _ x": first and last letters, the others hidden. Short tokens stay mostly hidden. */
function partial(text) {
  return text
    .trim()
    .split(/\s+/)
    .map((token) => {
      const letters = [...token];
      const shown = letters.map((l, i) =>
        letters.length >= 3 && (i === 0 || i === letters.length - 1) ? l : "_",
      );
      if (letters.length === 2) shown[0] = letters[0];
      return shown.join(" ");
    })
    .join("   ");
}

function label(word) {
  if (word.display_mode === "hidden") return "???";
  if (word.display_mode === "partial") return partial(word.word);
  return word.word;
}

// ---------------------------------------------------------------------------
// Animations: one class per kind on the .word (enter-fade, hit-shake, exit-slide…)
// ---------------------------------------------------------------------------
/** Plays an animation ("none" plays nothing). Only one animation class at a time. */
function play(el, kind, name) {
  for (const c of [...el.classList]) if (/^(enter|hit|exit)-/.test(c)) el.classList.remove(c);
  if (!name || name === "none") return;
  void el.offsetWidth; // restarts the animation if the same one was running
  const cls = `${kind}-${name}`;
  el.classList.add(cls);
  if (kind !== "exit") { // an exit animation keeps its end state until the element is removed
    el.addEventListener("animationend", (e) => {
      if (e.target === el) el.classList.remove(cls);
    }, { once: true });
  }
}

/** Plays the exit animation, then removes the element. */
function leave(el) {
  el.classList.add("leaving");
  play(el, "exit", animations.exit);
  if (getComputedStyle(el).animationName === "none") return el.remove(); // no animation (or none in custom CSS)
  el.addEventListener("animationend", () => el.remove(), { once: true });
  setTimeout(() => el.remove(), 3000); // safety net
}

// ---------------------------------------------------------------------------
// List
// ---------------------------------------------------------------------------
const SAMPLE = [{ id: "sample", word: "exemple", display_mode: "shown", count: 3 }];

function render(config) {
  applyStyle(config.display?.words ?? {});

  let active = (config.words ?? []).filter((w) => w.enabled && w.word.trim());
  if (PREVIEW && active.length === 0) active = SAMPLE;
  const ids = new Set(active.map((w) => w.id));

  for (const [id, entry] of words) {
    if (!ids.has(id)) {
      words.delete(id);
      leave(entry.el);
    }
  }

  for (const word of active) {
    let entry = words.get(word.id);
    if (!entry) {
      const el = document.createElement("div");
      el.className = "word";
      const textEl = document.createElement("span");
      textEl.className = "text";
      const countEl = document.createElement("span");
      countEl.className = "count";
      el.append(textEl, countEl);
      entry = { el, textEl, countEl, isNew: true };
      words.set(word.id, entry);
    }
    entry.textEl.textContent = label(word);
    entry.countEl.textContent = word.count;
  }

  // Keeps the DOM in the panel's order without moving (and so without restarting) the others.
  // Walks backwards: each element goes right before the next active one.
  let next = null;
  for (const word of [...active].reverse()) {
    const { el } = words.get(word.id);
    if (el.nextElementSibling !== next || !el.isConnected) document.body.insertBefore(el, next);
    next = el;
  }
  for (const word of active) {
    const entry = words.get(word.id);
    if (entry.isNew) {
      entry.isNew = false;
      play(entry.el, "enter", animations.enter);
    }
  }
}

function onDetection(word) {
  const entry = words.get(word.id);
  if (!entry) return;
  entry.countEl.textContent = word.count;
  play(entry.el, "hit", animations.hit);
}

// ---------------------------------------------------------------------------
// Preview (the panel asks to play an animation on the first word)
// ---------------------------------------------------------------------------
function preview(kind, name) {
  const entry = words.values().next().value;
  if (!entry) return;
  play(entry.el, kind, name);
  if (kind === "exit") {
    // The word comes back after leaving, so the animation can be watched again
    setTimeout(() => {
      play(entry.el, "enter", animations.enter);
    }, 1200);
  }
}

// ---------------------------------------------------------------------------
// Input: WebSocket (OBS) or panel messages (preview)
// ---------------------------------------------------------------------------
// Reconnects automatically if the app restarts
function connect(delay = 500) {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { delay = 500; };
  ws.onmessage = (e) => {
    const event = JSON.parse(e.data);
    if (event.type === "config") render(event.config);
    if (event.type === "detection") onDetection(event.word);
  };
  ws.onclose = () => setTimeout(() => connect(Math.min(delay * 2, 5000)), delay);
}

if (PREVIEW) {
  addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.source !== parent) return;
    if (e.data.type === "config") render(e.data.config);
    if (e.data.type === "play") preview(e.data.kind, e.data.name);
  });
} else {
  connect();
}
</script>
</body>
</html>
