<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slovonok — overlay</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  /* Every visual fills the screen without distortion:
     on an ultrawide screen it takes the full height and stays centered. */
  .visual {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  #enable-sound {
    position: fixed;
    left: 50%;
    bottom: 2rem;
    transform: translateX(-50%);
    padding: .75rem 1.25rem;
    font: 600 1rem system-ui, sans-serif;
    color: #fff;
    background: #000c;
    border-radius: .5rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="enable-sound" hidden>Click to allow sound (not needed in OBS)</div>
<script type="module">
// The same page is used in two places:
// - in OBS (browser source): /overlay/
// - on the streamer's screen (app window): /overlay/?target=screen
const TARGET = new URLSearchParams(location.search).get("target") === "screen" ? "screen" : "overlay";
let config = null;
const soundEnabled = () => config?.display?.[TARGET]?.sound ?? TARGET === "screen";

// ---------------------------------------------------------------------------
// Server connection (reconnects automatically if the app restarts)
// ---------------------------------------------------------------------------
function connect(delay = 500) {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { delay = 500; };
  ws.onmessage = (e) => {
    const event = JSON.parse(e.data);
    if (event.type === "config") config = event.config;
    if (event.type === "punishment") play(event.punishment);
  };
  ws.onclose = () => setTimeout(() => connect(Math.min(delay * 2, 5000)), delay);
}
connect();

// ---------------------------------------------------------------------------
// Playing punishments
// ---------------------------------------------------------------------------
const url = (file) => `/media/${encodeURIComponent(file)}`;

function play(p) {
  if (p.type === "sound") return playSound(p);
  if (p.type === "video") return playVideo(p);
  if (p.type === "image") return showImage(p);
}

// A regular browser blocks sound until the page has been clicked.
// OBS has no such restriction: the message only shows up during tests.
function start(media) {
  return media.play().catch((err) => {
    if (err.name === "NotAllowedError") {
      const button = document.getElementById("enable-sound");
      button.hidden = false;
      button.onclick = () => { button.hidden = true; };
    }
    throw err;
  });
}

function playSound(p) {
  if (!soundEnabled()) return;
  const audio = new Audio(url(p.file));
  audio.volume = p.volume;
  start(audio).catch(() => {});
}

function playVideo(p) {
  const video = document.createElement("video");
  video.src = url(p.file);
  video.volume = p.volume;
  video.muted = !soundEnabled();
  video.playsInline = true;

  let visual = video;
  let stopRenderer = () => {};
  if (p.chroma_key?.enabled) {
    const renderer = createChromaKeyRenderer(video, p.chroma_key);
    if (renderer) ({ canvas: visual, stop: stopRenderer } = renderer);
  }
  visual.classList.add("visual");
  document.body.append(visual);

  const cleanup = () => { stopRenderer(); visual.remove(); video.remove(); };
  video.onended = cleanup;
  video.onerror = cleanup;
  start(video).catch(cleanup);
}

function showImage(p) {
  const img = new Image();
  img.src = url(p.file);
  img.onload = () => {
    let visual = img;
    if (p.chroma_key?.enabled) {
      const renderer = createChromaKeyRenderer(img, p.chroma_key);
      if (renderer) visual = renderer.canvas;
    }
    visual.classList.add("visual");
    document.body.append(visual);
    setTimeout(() => visual.remove(), p.duration * 1000);
  };
}

// ---------------------------------------------------------------------------
// WebGL chroma key (same principle as the OBS filter: chrominance distance)
// ---------------------------------------------------------------------------
const VERTEX = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = vec2((a_pos.x + 1.0) / 2.0, (1.0 - a_pos.y) / 2.0);
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const FRAGMENT = `
precision mediump float;
uniform sampler2D u_tex;
uniform vec3 u_key;
uniform float u_similarity;
uniform float u_smoothness;
uniform float u_spill;
uniform vec2 u_margin; // ignored border, as a fraction of the size (encoding artifacts)
varying vec2 v_uv;

// Chrominance (Cb, Cr): the color without its brightness,
// so dark and light green areas are keyed the same way.
vec2 chroma(vec3 c) {
  return vec2(
    -0.1687 * c.r - 0.3313 * c.g + 0.5 * c.b,
     0.5 * c.r - 0.4187 * c.g - 0.0813 * c.b
  );
}

void main() {
  vec4 c = texture2D(u_tex, v_uv);
  float d = distance(chroma(c.rgb), chroma(u_key));
  float alpha = smoothstep(u_similarity, u_similarity + u_smoothness, d);
  if (any(lessThan(v_uv, u_margin)) || any(greaterThan(v_uv, 1.0 - u_margin))) alpha = 0.0;

  // Spill: desaturate pixels close to the key color (fringe on edges).
  float keep = pow(smoothstep(u_similarity, u_similarity + u_spill, d), 1.5);
  float luma = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
  vec3 rgb = mix(vec3(luma), c.rgb, keep);

  gl_FragColor = vec4(rgb * alpha, alpha); // premultiplied alpha
}`;

function hexToRgb(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

/** Draws `source` (video or image) into a canvas with the background keyed out.
 *  Returns null if WebGL is unavailable (the source is then shown as is). */
function createChromaKeyRenderer(source, settings) {
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true });
  if (!gl) {
    console.warn("WebGL unavailable: chroma key disabled");
    return null;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, VERTEX));
  gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, FRAGMENT));
  gl.linkProgram(program);
  gl.useProgram(program);

  // A full-screen rectangle (two triangles)
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, "a_pos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const u = (name) => gl.getUniformLocation(program, name);
  gl.uniform3fv(u("u_key"), hexToRgb(settings.color));
  gl.uniform1f(u("u_similarity"), settings.similarity);
  gl.uniform1f(u("u_smoothness"), settings.smoothness);
  gl.uniform1f(u("u_spill"), settings.spill);

  const isVideo = source instanceof HTMLVideoElement;
  let running = true;

  function draw() {
    const width = isVideo ? source.videoWidth : source.naturalWidth;
    const height = isVideo ? source.videoHeight : source.naturalHeight;
    if (!width) return; // video not ready yet
    // The canvas keeps the source's native resolution;
    // CSS (object-fit: contain) fits it to the screen without distortion.
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      gl.viewport(0, 0, width, height);
      // Videos often have a dark line on their edges: ignore 2 px.
      gl.uniform2f(u("u_margin"), 2 / width, 2 / height);
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  if (isVideo) {
    // requestVideoFrameCallback: one update per video frame, no more.
    const loop = () => {
      if (!running) return;
      draw();
      if ("requestVideoFrameCallback" in source) source.requestVideoFrameCallback(loop);
      else requestAnimationFrame(loop);
    };
    loop();
  } else {
    draw();
  }

  return { canvas, stop: () => { running = false; } };
}
</script>
</body>
</html>
